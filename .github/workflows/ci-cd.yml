name: CI/CD - API de scoring

# --- Declencheurs -----------------------------------------------------
on:
  push:
    branches: [main]          # deploiement automatique sur la branche principale
  pull_request:
    branches: [main]          # sur une PR : on teste, mais on ne deploie PAS
  workflow_dispatch:          # bouton "Run workflow" pour un lancement manuel

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: scoring-api

jobs:

  # ===================================================================
  # JOB 1 - QUALITE ET TESTS
  # ===================================================================
  test:
    name: Tests et qualite du code
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                       # cache des dependances entre les runs

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verifier le formatage et la qualite (ruff)
        run: |
          pip install ruff
          ruff check app/ tests/ scripts/ --output-format=github
        continue-on-error: true            # informatif : ne bloque pas le pipeline

      - name: Verifier la presence des artefacts du modele
        run: |
          test -f models/model.pkl     || (echo "model.pkl manquant" && exit 1)
          test -f models/metadata.json || (echo "metadata.json manquant" && exit 1)
          python -c "
          import json
          m = json.load(open('models/metadata.json'))
          assert 0 < m['threshold'] < 0.5, 'Seuil metier suspect : ' + str(m['threshold'])
          assert m['n_features'] > 0
          print('Artefacts OK - version', m['model_version'], '- seuil', m['threshold'])
          "

      - name: Lancer les tests avec couverture
        run: pytest --cov=app --cov-report=xml --cov-report=term -m "not slow"

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-couverture
          path: coverage.xml

  # ===================================================================
  # JOB 2 - CONSTRUCTION DE L'IMAGE DOCKER
  #   ne demarre QUE si le job "test" a reussi (needs: test)
  # ===================================================================
  build:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest
    needs: test                            # <-- LA GARANTIE DEMANDEE PAR L'ENONCE
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                      # on ne publie pas sur un registry
          load: true                       # on la garde en local pour la tester
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha             # cache des couches entre les runs
          cache-to: type=gha,mode=max

      - name: Test de fumee du conteneur
        run: |
          docker run -d --name api-test -p 7860:7860 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          echo "Attente du demarrage..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/health > /dev/null 2>&1; then
              echo "API prete apres ${i}s"; break
            fi
            sleep 1
          done

          echo "--- /health ---"
          curl -fsS http://localhost:7860/health | tee /tmp/health.json
          grep -q '"model_loaded":true' /tmp/health.json \
            || (echo "ECHEC : le modele n'est pas charge" && docker logs api-test && exit 1)

          echo "--- /predict ---"
          curl -fsS -X POST http://localhost:7860/predict \
            -H "Content-Type: application/json" \
            -d '{"client_id": 0}' | tee /tmp/predict.json
          grep -q '"decision"' /tmp/predict.json \
            || (echo "ECHEC : pas de decision renvoyee" && exit 1)

          echo "--- validation d'une entree invalide (422 attendu) ---"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:7860/predict -H "Content-Type: application/json" \
            -d '{"features": {"DAYS_BIRTH": 5000}}')
          test "$code" = "422" || (echo "ECHEC : code $code au lieu de 422" && exit 1)

          echo "Test de fumee reussi"
          docker stop api-test

  # ===================================================================
  # JOB 3 - DEPLOIEMENT SUR HUGGING FACE SPACES
  #   Depuis 2026, Hugging Face refuse les fichiers binaires pousses par
  #   un "git push" classique : ils doivent passer par le stockage Xet.
  #   Plutot que d'installer l'extension git-xet sur le runner, on utilise
  #   l'API huggingface_hub, qui route automatiquement les binaires vers
  #   Xet grace au paquet hf_xet.
  # ===================================================================
  deploy:
    name: Deploiement sur Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer le client Hugging Face
        run: pip install --quiet "huggingface_hub[hf_xet]"

      - name: Televerser vers le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          depot = f"{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE_NAME']}"
          api = HfApi(token=os.environ["HF_TOKEN"])

          # .gitattributes dedie au Space : declare les binaires comme "gros
          # fichiers". ATTENTION au nom du filtre : c'est bien "lfs", PAS "xet".
          # Xet est le backend de STOCKAGE du Hub, mais cote Git le protocole
          # reste celui de LFS (fichier pointeur "version https://git-lfs...").
          # Avec un filtre inconnu comme "xet", le conteneur de build recupere
          # le POINTEUR TEXTE au lieu du binaire, et l'API meurt au demarrage
          # avec "KeyError: 118" (118 = ord('v'), le 'v' de "version ...").
          Path(".gitattributes_space").write_text(
              "*.pkl filter=lfs diff=lfs merge=lfs -text\n"
              "*.onnx filter=lfs diff=lfs merge=lfs -text\n"
              "*.parquet filter=lfs diff=lfs merge=lfs -text\n"
              "*.joblib filter=lfs diff=lfs merge=lfs -text\n",
              encoding="utf-8",
          )
          api.upload_file(
              path_or_fileobj=".gitattributes_space",
              path_in_repo=".gitattributes",
              repo_id=depot,
              repo_type="space",
              commit_message="chore: stockage Xet pour les artefacts binaires",
          )

          resultat = api.upload_folder(
              repo_id=depot,
              repo_type="space",
              folder_path=".",
              commit_message=f"Deploiement automatique depuis GitHub Actions ({os.environ['GITHUB_SHA'][:7]})",
              allow_patterns=[
                  "app/**",
                  "models/model.pkl",
                  "models/metadata.json",
                  "models/model.onnx",
                  "data/clients_sample.parquet",
                  "Dockerfile",
                  "requirements.txt",
                  "README.md",
              ],
              # Nettoie du Space les fichiers retires du depot
              delete_patterns=["app/**", "models/**", "data/**"],
          )
          print(f"Deploiement envoye : {resultat}")

          # -----------------------------------------------------------------
          # Garde-fou : on relit le .gitattributes tel qu'il est SUR le Space.
          # C'est lui qui decide si le conteneur de build recevra le vrai
          # binaire ou un simple pointeur texte. Un filtre inconnu ("xet")
          # passe silencieusement ici mais tue l'API au demarrage avec
          # "KeyError: 118". On echoue donc dans la CI, pas en production.
          # -----------------------------------------------------------------
          from huggingface_hub import hf_hub_download

          attributs = Path(
              hf_hub_download(repo_id=depot, repo_type="space",
                              filename=".gitattributes")
          ).read_text(encoding="utf-8")

          for motif in ("*.pkl", "*.parquet"):
              ligne = next(
                  (l for l in attributs.splitlines() if l.startswith(motif)), ""
              )
              if "filter=lfs" not in ligne:
                  raise SystemExit(
                      f"ECHEC : sur le Space, {motif} n'est pas declare avec "
                      f"filter=lfs (ligne lue : {ligne!r}). Le conteneur de "
                      "build recevrait un pointeur texte au lieu du binaire."
                  )
          print("Controle du .gitattributes du Space : OK")
          PYTHON

      - name: Attendre le redemarrage et verifier
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          URL="https://${HF_USERNAME}-${HF_SPACE_NAME}.hf.space/health"
          echo "Verification de $URL"
          echo "Hugging Face reconstruit l'image : cela prend 2 a 6 minutes."
          for i in $(seq 1 40); do
            if curl -fsS "$URL" | grep -q '"model_loaded":true'; then
              echo "Deploiement verifie apres $((i*15))s"
              curl -s "$URL"
              exit 0
            fi
            sleep 15
          done
          echo "L'API n'a pas repondu dans le delai imparti."
          echo "Consulte les logs de build : https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          exit 1

      - name: Recapitulatif
        if: always()
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          {
            echo "## Deploiement termine"
            echo ""
            echo "| Element | Valeur |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Space | https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME} |"
            echo "| API | https://${HF_USERNAME}-${HF_SPACE_NAME}.hf.space |"
            echo "| Documentation | https://${HF_USERNAME}-${HF_SPACE_NAME}.hf.space/docs |"
          } >> $GITHUB_STEP_SUMMARY
