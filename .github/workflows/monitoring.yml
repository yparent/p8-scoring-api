# .github/workflows/monitoring.yml
name: Monitoring quotidien

on:
  schedule:
    - cron: "0 6 * * *"        # tous les jours a 6h UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Recuperer les logs de production
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/fetch_logs.py \
            --repo "${{ secrets.HF_USERNAME }}/p8-production-logs" \
            --token "$HF_TOKEN"

      - name: Executer l'analyse de drift
        run: |
          jupyter nbconvert --to notebook --execute \
            notebooks/04_data_drift.ipynb \
            --output executed_drift.ipynb --ExecutePreprocessor.timeout=900

      - name: Archiver les rapports
        uses: actions/upload-artifact@v4
        with:
          name: rapport-drift-${{ github.run_number }}
          path: |
            notebooks/executed_drift.ipynb
            monitoring/reports/*.html
            monitoring/synthese_monitoring.json

      - name: Ouvrir une issue si alerte
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const s = JSON.parse(
              fs.readFileSync('monitoring/synthese_monitoring.json', 'utf8'));
            if (s.verdict.niveau === 'OK') {
              core.info('Aucune anomalie detectee');
              return;
            }
            const corps = [
              `**Niveau : ${s.verdict.niveau}**`, '',
              '### Alertes', ...s.verdict.alertes.map(a => `- ${a}`), '',
              '### Indicateurs',
              `- predictions analysees : ${s.volumes.predictions}`,
              `- taux d'erreur : ${(100*s.volumes.taux_erreur).toFixed(2)} %`,
              `- latence p95 : ${s.performance.latence_p95_ms} ms`,
              `- colonnes en derive : ${s.data_drift.colonnes_en_derive}`,
              `- PSI des scores : ${s.prediction_drift.psi_scores}`,
              `- taux de refus : ${(100*s.prediction_drift.taux_refus_production).toFixed(1)} %`,
              '', `Rapport complet : run #${context.runNumber}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[Monitoring ${s.verdict.niveau}] Analyse du ${s.date_analyse.slice(0,10)}`,
              body: corps,
              labels: ['monitoring', s.verdict.niveau.toLowerCase()],
            });
